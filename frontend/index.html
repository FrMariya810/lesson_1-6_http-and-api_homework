<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Каталог книг"
    />
    <title>Каталог книг</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header__content">
        <p class="page-header__eyebrow">ДЗ 6 · HTTP и API</p>
        <h1 class="page-header__title">Каталог</h1>
        <p class="page-header__lead">
          Каталог книг
        </p>
      </div>
    </header>

    <main class="workspace">
      <section class="panel panel--collection" aria-labelledby="collection-title">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Каталог книг</p>
            <h2 class="panel__title" id="collection-title">Книги</h2>
          </div>

          <button class="button button--secondary" type="button" data-action="reload">
            Обновить
          </button>
        </div>

        <p class="endpoint">
          Endpoint:
          <code class="endpoint__value" data-ui="endpoint">http://localhost:3000/books</code>
        </p>

        <div class="status" data-ui="status" role="status" aria-live="polite">
          <strong class="status__title">Ожидание подключения</strong>
          <span class="status__text">Загрузка книг…</span>
        </div>

        <div class="collection" data-ui="collection" aria-live="polite"></div>

        <div class="empty-state" data-ui="empty" hidden>
          Пока нет ни одной книги. Добавьте первую через форму.
        </div>

        <p
          class="collection__hint"
          data-ui="collection-status"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <section class="panel panel--form" aria-labelledby="form-title">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Новая запись</p>
            <h2 class="panel__title" id="form-title">Добавить книгу</h2>
          </div>
        </div>

        <form class="entry-form" data-form="entry">
          <div class="field">
            <label class="field__label" for="entry-title">Название</label>
            <input
              class="field__control"
              id="entry-title"
              name="title"
              type="text"
              minlength="2"
              maxlength="120"
              placeholder="Например, «Дюна»"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="entry-author">Автор</label>
            <input
              class="field__control"
              id="entry-author"
              name="author"
              type="text"
              minlength="2"
              maxlength="120"
              placeholder="Например, Фрэнк Герберт"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="entry-genre">Жанр</label>
            <input
              class="field__control"
              id="entry-genre"
              name="genre"
              type="text"
              minlength="2"
              maxlength="60"
              placeholder="Например, фантастика"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="entry-year">Год издания</label>
            <input
              class="field__control"
              id="entry-year"
              name="year"
              type="number"
              min="1"
              max="2100"
              placeholder="1965"
              required
            />
          </div>

          <div class="field field--checkbox">
            <input
              class="field__checkbox"
              id="entry-available"
              name="available"
              type="checkbox"
              checked
            />
            <label class="field__label" for="entry-available">
              Доступна в библиотеке
            </label>
          </div>

          <div class="entry-form__actions">
            <button class="button button--primary" type="submit" data-action="submit">
              Отправить в API
            </button>
          </div>

          <p class="entry-form__hint" data-ui="submit-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <p class="page-footer__text">
        Домашнее задание 6. Каталог книг.
      </p>
    </footer>
  </body>
</html>
